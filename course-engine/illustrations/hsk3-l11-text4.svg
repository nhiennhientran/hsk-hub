<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">一个木制方向牌分别指向北京和上海，表示两个城市的选择。</title><desc id="desc">Biển chỉ đường bằng gỗ lần lượt chỉ Bắc Kinh và Thượng Hải, thể hiện lựa chọn giữa hai thành phố. Original instructional vector illustration.</desc><rect x="0" y="0" width="640" height="400" rx="0" fill="#e7ece5" stroke="none" stroke-width="3"/><ellipse cx="320" cy="347" rx="197" ry="25" fill="#c5d6ce" stroke="none" stroke-width="2"/><rect x="303" y="75" width="31" height="271" rx="4" fill="#c09a68" stroke="#243a50" stroke-width="3"/><path d="M126 103L306 103L306 167L126 167L81 135Z" fill="#e0c58f" stroke="#243a50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M334 211L514 211L563 245L514 277L334 277Z" fill="#e0c58f" stroke="#243a50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="144" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="34" font-weight="600" fill="#243a50" text-anchor="middle">北京</text><text x="430" y="252" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="34" font-weight="600" fill="#243a50" text-anchor="middle">上海</text><rect x="39" y="256" width="26" height="81" rx="2" fill="#b0c6bc" stroke="none" stroke-width="3"/><rect x="93" y="278" width="26" height="59" rx="2" fill="#b0c6bc" stroke="none" stroke-width="3"/><rect x="516" y="243" width="26" height="94" rx="2" fill="#b0c6bc" stroke="none" stroke-width="3"/><rect x="574" y="273" width="26" height="64" rx="2" fill="#b0c6bc" stroke="none" stroke-width="3"/></svg>
