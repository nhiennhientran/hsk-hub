name: HSK1 native seek diagnosis
on:
  push:
    branches: ['verify/hsk1-native-seek-20261001']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1 jsdom@26.1.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test isolated JSDOM cleanup without changing production playback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('new-hsk1/hsk1/audio-architecture-runtime.cjs')
          s=p.read_text()
          for v in ['a','x','six','c']:
              s=s.replace(v+'.w.HSK1_OFFICIAL_AUDIO.stop();'+v+'.dom.window.close();',v+'.w.HSK1_OFFICIAL_AUDIO.stop();await wait();await wait();'+v+'.dom.window.close();')
          p.write_text(s)
          PY
          node new-hsk1/hsk1/audio-architecture-runtime.cjs
      - name: Compare native replay strategies
        if: always()
        env:
          HSK_BROWSER: ${{ matrix.browser }}
        run: node tools/tests/native-seek-diagnostic.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-seek-${{ matrix.browser }}
          path: seek-evidence/
          retention-days: 14
