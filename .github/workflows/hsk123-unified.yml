name: HSK123 unified checkpoint
on:
  push:
    branches: ['feature/hsk123-unified-learning-20261003', 'work/codex-hsk-resume-20261004', 'work/hsk-autonomous-execution-20261004']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix course-app && npm ci --prefix hsk1-app
      - run: npm test --prefix course-app && npm test --prefix hsk1-app
      - run: npm run build --prefix course-app
      - name: Verify complete HSK1 source catalogue and both-host asset bindings
        working-directory: course-app
        run: node --experimental-strip-types tools/verify-hsk1-source-catalogue.mjs
      - name: Typecheck new browser fixtures and readiness helpers
        run: npm run check:browser-fixtures --prefix course-app
      - name: Install browser and Chinese fonts
        working-directory: course-app
        run: npx playwright install --with-deps ${{ matrix.browser }} && sudo apt-get install -y fonts-noto-cjk
      - name: Verify exact browser shard coverage
        if: matrix.browser == 'chromium' && matrix.shard == 1
        working-directory: course-app
        run: node tools/verify-browser-shards.mjs
      - name: Focused mobile and content preflight
        if: matrix.shard == 1
        working-directory: course-app
        run: npx playwright test --config=playwright.unified.config.ts --project=${{ matrix.browser }} --grep 'lesson 2 reviewed textbook sections at (320|390)|lesson7 source surveys|lesson9 headerless source comparison|lesson12 four-person survey|lesson13 original ambiguous-key explanation|lesson15 frequency table|lesson15 cross-page review|HSK3 lesson 2 reviewed textbook sections at 320|HSK3 lesson2 source menu|HSK3 lesson2 group support|HSK3 lesson 4 source-specific textbook views at 320|HSK3 lesson4 grouped source explanations|HSK3 lesson5 pair table|HSK3 lesson6 ten-row review|HSK3 lesson7 typed measure words|HSK3 lesson7 source explanation|HSK3 lesson7 twelve picture blanks|HSK3 lesson 8 source-specific textbook views at 320|HSK3 lesson 9 source-specific textbook views at 320|HSK3 lesson9 eleven-row review|HSK3 lesson9 potential complement|HSK3 lesson8 reading references|HSK3 lesson9 reading references|HSK3 prior fallback responses|HSK3 lesson 10 source-specific textbook views at 320|HSK3 lesson 11 source-specific textbook views at 320|HSK3 lesson10 education comparison|HSK3 lesson11 repaired Vietnamese|HSK3 lesson10 repaired picture dialogues|HSK3 lesson10 and11 grouped source grammar|HSK3 lesson 12 source-specific textbook views at 320|HSK3 lesson 13 source-specific textbook views at 320|HSK3 lesson12 explicit optional continuation|HSK3 lesson13 nine grammar frames|HSK3 lesson12 cross-page review|HSK3 lesson 14 source-specific views render every distinct manifest identity once at 320|HSK3 lesson 15 source-specific views render every distinct manifest identity once at 320|HSK3 lesson15 overlapping Nanjing|HSK3 lesson15 four named cities stay in their own activity before its response at 320|HSK3 lesson14 borrowing translation|HSK3 lesson15 review has ten|HSK3 lesson 16 final-unit source views and every manifest identity at 320|HSK3 lesson 17 final-unit source views and every manifest identity at 320|HSK3 lesson 18 final-unit source views and every manifest identity at 320|HSK3 lesson16 explicit optional continuation|HSK3 lesson17 seven-expression support|HSK3 lesson18 actual 刚才|HSK3 lesson18 final source review|HSK3 lesson18 feedback-only explanation'
      - name: Focused WebKit native startup-position regression
        if: matrix.browser == 'webkit' && matrix.shard == 1
        working-directory: course-app
        run: |
          status=0
          npx playwright test --config=playwright.unified.config.ts --project=webkit --grep 'HSK 2 lesson 3 scene 4 all original sentences obey native boundaries' --output=test-results/audio-startup-focused || status=$?
          cp .repro-output/unified-browser.json .repro-output/audio-startup-focused.json
          exit "$status"
      - name: Test unified app checkpoint
        working-directory: course-app
        run: npx playwright test --config=playwright.unified.config.ts --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Build and verify standalone HSK1 listening and source backup regressions
        if: matrix.shard == 2
        run: npm run build --prefix hsk1-app && cd hsk1-app && npx playwright test textbook-scene-navigation.spec.ts source-pilot.spec.ts source-catalogue.spec.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-reports-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            course-app/.repro-output/
            hsk1-app/.repro-output/
            course-app/test-results/**/*.md
            hsk1-app/test-results/**/*.md
            checkpoints/unified-20261003/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-pilot-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            course-app/test-results/*.png
            !course-app/test-results/unified-hsk2-lesson*.png
            !course-app/test-results/unified-hsk3-lesson*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-lessons23-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk2-lesson[23]-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-lessons45-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk2-lesson[45]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-lessons67-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk2-lesson[67]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-lessons89-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk2-lesson[89]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-lessons1011-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk2-lesson1[01]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-lessons1213-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk2-lesson1[23]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-lessons1415-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk2-lesson1[45]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons23-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson[23]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons45-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson[45]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons67-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson[67]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons89-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson[89]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons1011-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson1[01]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons1213-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson1[23]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons1415-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson1[45]-*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-hsk3lessons1618-screens-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: course-app/test-results/unified-hsk3-lesson1[678]-*.png

      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 2
        with:
          name: hsk1-standalone-scene-${{ matrix.browser }}
          path: |
            hsk1-app/.repro-output/step8-browser.json
            hsk1-app/test-results/hsk1-scene-*.png
            hsk1-app/test-results/modular-hsk1-source-*.png
            hsk1-app/test-results/modular-hsk1-source-*.json
            hsk1-app/test-results/**/*.md
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk1-unified-source-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            course-app/test-results/unified-hsk1-source-*.png
            course-app/test-results/unified-hsk1-source-*.json
