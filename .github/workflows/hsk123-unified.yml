name: HSK123 unified checkpoint
on:
  push:
    branches: ['feature/hsk123-unified-learning-20261003']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix course-app && npm ci --prefix hsk1-app
      - run: npm test --prefix course-app && npm test --prefix hsk1-app
      - run: npm run build --prefix course-app
      - name: Install browser and Chinese fonts
        working-directory: course-app
        run: npx playwright install --with-deps ${{ matrix.browser }} && sudo apt-get install -y fonts-noto-cjk
      - name: Test unified app checkpoint
        working-directory: course-app
        run: npx playwright test --config=playwright.unified.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk123-unified-${{ matrix.browser }}
          path: |
            course-app/.repro-output/
            course-app/test-results/
            checkpoints/unified-20261003/
          include-hidden-files: true
