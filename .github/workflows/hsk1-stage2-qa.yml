name: HSK1 Step 2 homework QA
on:
  push:
    branches: ['work/hsk1-stage2-*']
    paths:
      - 'new-hsk1/hsk1/stage2/**'
      - 'docs/stage2/curriculum-review.md'
      - 'docs/stage2/teacher-01-05.md'
      - 'docs/stage2/teacher-06-10.md'
      - 'docs/stage2/teacher-11-15.md'
      - 'tools/tests/stage2-*'
      - 'tools/serve-stage2.cjs'
      - 'tools/build-stage2.cjs'
      - '.github/workflows/hsk1-stage2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homework:
    if: startsWith(github.ref, 'refs/heads/work/hsk1-stage2-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the independent 15-lesson homework artifact
        run: node tools/build-stage2.cjs
      - name: Verify curriculum sources and reviewed content versions
        run: node tools/tests/stage2-curriculum.cjs
      - name: Check all-lesson state, explicit migrations and backup capacity
        run: node --test tools/tests/stage2-engine.test.cjs
      - name: Install the official isolated browser dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium for software regression tests
        run: npx playwright install --with-deps chromium
      - name: Install Chinese glyphs for evidence screenshots
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Exercise all 225 tasks through the user interface
        env:
          HSK_STEP2_PORT: '18766'
        run: node tools/tests/stage2-browser.cjs
      - name: Save Step 2 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk1-step2-evidence
          path: |
            tools/tests/results/stage2-*
            dist/stage2/*.html
          if-no-files-found: warn
