# Candidate only; root owns actual .github and remote execution.
name: HSK guarded crop crosscheck
on:
  workflow_dispatch:
  push:
    branches:
      - work/hsk-audio-asr-pilot-20261004
    paths:
      - .github/workflows/hsk-audio-crop-crosscheck.yml
      - course-app/docs/resume-20261004/media-closure/asr-evidence/transcribe-candidate-crops.py
      - course-app/docs/resume-20261004/media-closure/asr-evidence/padded-crop-review-input.json
permissions:
  contents: read
concurrency:
  group: hsk-audio-crop-crosscheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crops:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [small, medium]
    env:
      EVIDENCE_HOME: course-app/docs/resume-20261004/media-closure/asr-evidence
      EVIDENCE_OUTPUT: .repro-output/asr-crop-evidence/${{ matrix.model }}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.13"
      - run: mkdir -p "$EVIDENCE_OUTPUT"
      - name: Explicit PCM decoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Fixed dependency provenance
        run: |
          python -m pip install pip==25.2
          python -m pip install --only-binary=:all: --report "$EVIDENCE_OUTPUT/pip-install-report.json" -r "$EVIDENCE_HOME/requirements.txt"
          python -m pip check
          python -m pip freeze --all > "$EVIDENCE_OUTPUT/pip-freeze.txt"
      - name: Fixed model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .repro-output/asr-model-cache/models--Systran--faster-whisper-${{ matrix.model }}
          key: hsk-crop-public-model-${{ matrix.model }}-fixed-small536b066-medium08e178d-${{ runner.os }}
      - name: Transcribe the three real proposed crops without expected text
        run: |
          python "$EVIDENCE_HOME/transcribe-candidate-crops.py" --model "${{ matrix.model }}" --input "$EVIDENCE_HOME/padded-crop-review-input.json" --output "$EVIDENCE_OUTPUT"
      - name: Evidence only, no release or promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hsk-three-crop-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .repro-output/asr-crop-evidence/${{ matrix.model }}/
          retention-days: 30
          if-no-files-found: warn
