name: HSK continuation engineering checkpoint
on:
  workflow_dispatch:
  push:
    branches: ['work/hsk-continue-20261005']
permissions:
  contents: read
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      HSK_CONTINUE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Pin actual checkout and runtime source
        run: node course-app/docs/continue-20261005/record-checkpoint.mjs before
      - name: Install exact locked dependencies
        run: npm ci --prefix course-app && npm ci --prefix hsk1-app
      - name: Full unit, content, migration and type checks
        run: |
          mkdir -p course-app/.repro-output/continue-20261005/${HSK_CONTINUE_BROWSER}
          npm test --prefix course-app 2>&1 | tee course-app/.repro-output/continue-20261005/${HSK_CONTINUE_BROWSER}/course-units.log
          npm test --prefix hsk1-app 2>&1 | tee course-app/.repro-output/continue-20261005/${HSK_CONTINUE_BROWSER}/hsk1-units.log
          npm run content:check --prefix course-app
          npm run fixtures:check --prefix hsk1-app
          npm run check --prefix course-app
          npm run check --prefix hsk1-app
          course-app/node_modules/.bin/tsc -p course-app/docs/continue-20261005/tsconfig.json
      - name: Install actual locked browser and Chinese fonts
        working-directory: course-app
        run: node node_modules/@playwright/test/cli.js install --with-deps ${HSK_CONTINUE_BROWSER} && sudo apt-get install -y fonts-noto-cjk
      - name: Build both current applications
        run: |
          npm run build --prefix course-app
          npm run build --prefix hsk1-app
          node course-app/docs/continue-20261005/record-checkpoint.mjs builds
      - name: Collect exact case identities before native execution
        run: |
          node course-app/node_modules/@playwright/test/cli.js test --config=course-app/docs/continue-20261005/playwright.continue.config.ts --list --reporter=json > course-app/.repro-output/continue-20261005/${HSK_CONTINUE_BROWSER}/shared-collection.json
          node hsk1-app/node_modules/@playwright/test/cli.js test --config=hsk1-app/playwright.continue.config.ts --list --reporter=json > course-app/.repro-output/continue-20261005/${HSK_CONTINUE_BROWSER}/hsk1-collection.json
      - name: Execute navigation and retained draft regressions on compiled shared app
        working-directory: course-app
        env:
          DEBUG: pw:browser
        run: node node_modules/@playwright/test/cli.js test --config=docs/continue-20261005/playwright.continue.config.ts 2>&1 | tee .repro-output/continue-20261005/${HSK_CONTINUE_BROWSER}/shared-browser-launches.log
      - name: Execute HSK1 source version and existing display history integration fixtures
        env:
          DEBUG: pw:browser
        run: node hsk1-app/node_modules/@playwright/test/cli.js test --config=hsk1-app/playwright.continue.config.ts 2>&1 | tee course-app/.repro-output/continue-20261005/${HSK_CONTINUE_BROWSER}/hsk1-browser-launches.log
      - name: Reject missing native evidence, retries, stale inputs or changed compiled bytes
        run: node course-app/docs/continue-20261005/record-checkpoint.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk-continue-20261005-${{ matrix.browser }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            course-app/.repro-output/continue-20261005/${{ matrix.browser }}/
            course-app/docs/continue-20261005/*.ts
            course-app/docs/continue-20261005/tsconfig.json
            course-app/docs/continue-20261005/record-checkpoint.mjs
            hsk1-app/playwright.continue.config.ts
            .github/workflows/hsk-continue-20261005.yml
