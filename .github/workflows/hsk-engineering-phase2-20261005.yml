name: HSK engineering phase 2 compiled checkpoint
on:
  push:
    branches: ['work/hsk-engineering-phase2-20261005']
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      HSK_PHASE2_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Pin actual checkout, full declared inputs and protected production
        run: node course-app/docs/continue-phase2-20261005/ci/record-checkpoint.mjs before
      - name: Install exact locked dependencies
        run: npm ci --prefix course-app && npm ci --prefix hsk1-app
      - name: Full units, source, migration and selected fixture type checks
        run: |
          OUT="$PWD/course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}"
          npm test --prefix course-app 2>&1 | tee "$OUT/course-units.log"
          npm test --prefix hsk1-app 2>&1 | tee "$OUT/hsk1-units.log"
          npm run content:check --prefix course-app
          npm run fixtures:check --prefix hsk1-app
          npm run check --prefix course-app
          npm run check --prefix hsk1-app
          course-app/node_modules/.bin/tsc -p course-app/docs/continue-phase2-20261005/history/tsconfig.json
          course-app/node_modules/.bin/tsc -p course-app/docs/continue-phase2-20261005/visual/tsconfig.json
          course-app/node_modules/.bin/tsc -p course-app/tsconfig.package-check.json
          course-app/node_modules/.bin/tsc -p course-app/docs/continue-phase2-20261005/ci/tsconfig.json
          node --test course-app/docs/continue-phase2-20261005/ci/native-completion.test.mjs
      - name: Finite Git diagnostic stress without retry or source-directory output
        run: |
          OUT="$PWD/course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}"
          HSK_PHASE2_DIAGNOSTIC_OUT="$OUT/ci-git" node --experimental-strip-types course-app/docs/continue-phase2-20261005/ci-git/stress-readiness.mjs --runs=12 --parallel=3 2>&1 | tee "$OUT/ci-git-stress.log"
      - name: Actual 48-lesson nonempty module roundtrip and retained identity checks
        run: |
          OUT="$PWD/course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}"
          HSK_PHASE2_HISTORY_OUTPUT="$OUT/history-module" node --experimental-strip-types --test course-app/docs/continue-phase2-20261005/history/run-current-all48-roundtrip.mjs 2>&1 | tee "$OUT/all48-module.log"
      - name: Install actual locked browser and Chinese fonts
        working-directory: course-app
        run: node node_modules/@playwright/test/cli.js install --with-deps ${HSK_PHASE2_BROWSER} && sudo apt-get install -y fonts-noto-cjk
      - name: Build, freeze and assemble the actual engineering checkpoint
        working-directory: course-app
        run: |
          node docs/continue-phase2-20261005/package/build-checkpoint.mjs 2>&1 | tee ".repro-output/continue-phase2/${HSK_PHASE2_BROWSER}/package-build.log"
          node docs/continue-phase2-20261005/ci/record-checkpoint.mjs builds
          node docs/continue-phase2-20261005/package/verify-draft-guards.mjs
          python3 docs/continue-phase2-20261005/ci/freeze-client-bytes.py
      - name: Collect exact scoped case identities before native execution
        run: |
          OUT="$PWD/course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}"
          node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/history/playwright.shared.config.ts --project=${HSK_PHASE2_BROWSER} --list --reporter=json > "$OUT/history-shared-collection.json"
          node hsk1-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/history/playwright.hsk1.config.ts --project=${HSK_PHASE2_BROWSER} --list --reporter=json > "$OUT/history-hsk1-collection.json"
          node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/history/playwright.legacy.config.ts --project=${HSK_PHASE2_BROWSER} --list --reporter=json > "$OUT/history-legacy-collection.json"
          node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/visual/playwright.visual.config.ts --project=shared-${HSK_PHASE2_BROWSER} --project=standalone-${HSK_PHASE2_BROWSER} --project=package-${HSK_PHASE2_BROWSER} --list --reporter=json > "$OUT/visual-collection.json"
          node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/ci/playwright.package.config.ts --list --reporter=json > "$OUT/package-collection.json"
      - name: Execute actual all-lesson and nonempty shared history flows
        env:
          DEBUG: pw:browser
        run: node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/history/playwright.shared.config.ts --project=${HSK_PHASE2_BROWSER} 2>&1 | tee course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}/history-shared-browser-launches.log
      - name: Execute retained HSK1 compiled backup and schema isolation flows
        env:
          DEBUG: pw:browser
        run: node hsk1-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/history/playwright.hsk1.config.ts --project=${HSK_PHASE2_BROWSER} 2>&1 | tee course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}/history-hsk1-browser-launches.log
      - name: Execute actual retained and nested grade entries
        env:
          DEBUG: pw:browser
        run: node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/history/playwright.legacy.config.ts --project=${HSK_PHASE2_BROWSER} 2>&1 | tee course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}/history-legacy-browser-launches.log
      - name: Execute current compiled hosts at five widths and package homework at narrow widths
        env:
          DEBUG: pw:browser
        run: node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/visual/playwright.visual.config.ts --project=shared-${HSK_PHASE2_BROWSER} --project=standalone-${HSK_PHASE2_BROWSER} --project=package-${HSK_PHASE2_BROWSER} 2>&1 | tee course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}/visual-browser-launches.log
      - name: Execute actual checkpoint crop, audio, HTTP bytes and private path closure
        env:
          DEBUG: pw:browser
        run: node course-app/node_modules/@playwright/test/cli.js test -c course-app/docs/continue-phase2-20261005/ci/playwright.package.config.ts 2>&1 | tee course-app/.repro-output/continue-phase2/${HSK_PHASE2_BROWSER}/package-browser-launches.log
      - name: Reject missing evidence, skipped cases, retries, changed input or compiled bytes
        if: always()
        run: node course-app/docs/continue-phase2-20261005/ci/record-checkpoint.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk-engineering-phase2-${{ matrix.browser }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/before.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/builds.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/after.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/*-collection.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/*-results.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/*.log
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/ci-git/
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/history-module/
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/assembly.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/package-summary.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/build-inputs-before.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/build-inputs-after.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/standalone-private-source-audit.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/standalone-file-inventory.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/commands.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/failure.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/guard-probes.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/logs/
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/compiled-client-bytes.zip
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/compiled-client-bytes.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/package/unified-site/course-engine/unified-release-manifest.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/visual/native-results.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/visual/native/**/*.png
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/visual/native/**/*.json
            course-app/.repro-output/continue-phase2/${{ matrix.browser }}/visual/native/**/*.md
