name: HSK1 modular step9 release
on:
  push:
    branches: ['work/hsk1-modular-step9-20261002']
    paths: ['hsk1-app/**', '!hsk1-app/docs/**', '!hsk1-app/review/step9-*', '.github/workflows/hsk1-modular-step9.yml', 'new-hsk1/hsk1/audio-architecture-check.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hsk1-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: hsk1-app/package-lock.json
      - run: npm ci
      - run: npm run catalog:check && npm run fixtures:check && npm test
      - name: Build once, audit sources privately, strip public maps, freeze exact public bytes
        run: npm run build:release && npm run public:check
      - uses: actions/upload-artifact@v4
        with:
          name: step9-shared-release
          path: |
            hsk1-app/dist/
            hsk1-app/.repro-output/student-build-source-audit.json
          include-hidden-files: true
  checkpoint:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hsk1-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: hsk1-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: step9-shared-release
          path: hsk1-app
      - name: Verify the one shared public artifact without rebuilding
        run: npm run public:check && npm run student:check && npm run assets:check && node tools/test-release-architecture.mjs
      - name: Use official Ubuntu archive for fixed browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          source_dir = Path('/etc/apt/sources.list.d')
          for path in [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'), *source_dir.glob('*.list'), *source_dir.glob('*.sources')]:
              if path.exists():
                  text = path.read_text()
                  path.write_text(text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu'))
          PY
      - name: Install fixed browser
        timeout-minutes: 8
        run: |
          npx playwright install-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install ${{ matrix.browser }}
      - run: npm run test:smoke -- --project=${{ matrix.browser }}
      - run: npm run test:release -- --project=${{ matrix.browser }}
        env:
          HSK_EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step9-${{ matrix.browser }}-evidence
          path: |
            hsk1-app/.repro-output/
            hsk1-app/test-results/
            hsk1-app/test-results-release/
          include-hidden-files: true
