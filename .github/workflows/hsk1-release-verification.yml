name: HSK1 read-only release verification
on:
  push:
    branches: ['verify/hsk1-release-20261001']
    paths: ['tools/release-check/**','.github/workflows/hsk1-release-verification.yml']
permissions:
  contents: read
  pages: read
concurrency:
  group: hsk1-readonly-release-verification
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read Pages configuration, preserve rollback source and verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release-check/verify.py
      - name: Preserve frozen source analysis and teacher references separately from runtime
        run: |
          git fetch --no-tags --depth=1 origin de823050e97cbab64144197f3bf9241321b73c59 2c6d3b38866dcfbcf101974302609c470f1d2443
          mkdir -p release-evidence/frozen-audit release-evidence/teacher-reference
          for f in stage3-asr-clips.json stage3-asr-recheck.json stage3-asr-tracks.json; do git show de823050e97cbab64144197f3bf9241321b73c59:tools/tests/results/$f > release-evidence/frozen-audit/$f; done
          for f in audio-audit.md review.md; do git show de823050e97cbab64144197f3bf9241321b73c59:docs/stage3/$f > release-evidence/frozen-audit/$f || rm -f release-evidence/frozen-audit/$f; done
          for f in teacher-01-05.md teacher-06-10.md teacher-11-15.md curriculum-review.md independent-review.md; do git show 2c6d3b38866dcfbcf101974302609c470f1d2443:docs/stage2/$f > release-evidence/teacher-reference/$f; done
      - name: Preserve read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk1-release-source-verification
          path: release-evidence/
          retention-days: 30
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact candidate and rollback baseline without changing production
        run: |
          CANDIDATE=$(node -p "require('./tools/release-check/config.json').candidate")
          BEFORE=$(node -p "require('./tools/release-check/config.json').productionBefore")
          git fetch --no-tags --depth=1 origin "$CANDIDATE" "$BEFORE"
          mkdir -p candidate prior
          git archive "$CANDIDATE" | tar -x -C candidate
          git archive "$BEFORE" | tar -x -C prior
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Rehearse reversible assets or verify actual published site with native browsers
        env:
          HSK_BROWSER: ${{ matrix.browser }}
        run: node tools/release-check/browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk1-release-browser-${{ matrix.browser }}
          path: release-evidence/
          retention-days: 30
          if-no-files-found: error
