name: HSK1 integration Step 1 review
on:
  push:
    branches: ['work/hsk1-stage4-1-runtime-20261001']
    paths:
      - '.github/workflows/hsk1-integration-step1.yml'
      - 'tools/apply-integration-step1.py'
      - 'tools/refine-integration-step1.py'
      - 'tools/integration-step1-textbook.js.in'
      - 'tools/serve-integration-step1.cjs'
      - 'tools/tests/integration-step1*'
      - 'new-hsk1/hsk1/**'
permissions:
  contents: read
concurrency:
  group: hsk1-integration-step1-review
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/work/hsk1-stage4-1-runtime-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.save.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the reviewed repairs only to the draft branch
        run: |
          python tools/apply-integration-step1.py
          python tools/refine-integration-step1.py
          node --check tools/tests/integration-step1-browser.cjs
          node --check tools/tests/integration-step1-extra.cjs
          node --check new-hsk1/hsk1/textbook-integration-corrections.js
          node --test tools/tests/stage2-engine.test.cjs tools/tests/stage3-engine.test.cjs
      - name: Save candidate, never deploy
        id: save
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/hsk1-stage4-1-runtime-20261001'
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed={'new-hsk1/hsk1/learning-integrated.js','new-hsk1/hsk1/learning-integrated.css','new-hsk1/hsk1/learning-links.js','new-hsk1/hsk1/learning.html','new-hsk1/hsk1/index.html','new-hsk1/hsk1/lesson.html','new-hsk1/hsk1/stage2/app.js','new-hsk1/hsk1/stage3/app.js','new-hsk1/hsk1/stage3/player.js','new-hsk1/hsk1/textbook-integration-corrections.js','tools/tests/stage3-engine.test.cjs','tools/tests/integration-step1-browser.cjs'}
          assert set(changed)<=allowed, changed
          PY
          git add new-hsk1/hsk1/learning-integrated.js new-hsk1/hsk1/learning-integrated.css new-hsk1/hsk1/learning-links.js new-hsk1/hsk1/learning.html new-hsk1/hsk1/index.html new-hsk1/hsk1/lesson.html new-hsk1/hsk1/stage2/app.js new-hsk1/hsk1/stage3/app.js new-hsk1/hsk1/stage3/player.js new-hsk1/hsk1/textbook-integration-corrections.js tools/tests/stage3-engine.test.cjs tools/tests/integration-step1-browser.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'HSK integration review'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Step 1: apply source-verified first-eight textbook and session-continuation repairs'
            git push origin HEAD:refs/heads/work/hsk1-stage4-1-runtime-20261001
          fi
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine checks include the shipped content, without skips
        run: |
          mkdir -p tools/tests/results
          git rev-parse HEAD > tools/tests/results/stage4-1-${{ matrix.browser }}-commit.txt
          node --test tools/tests/stage2-engine.test.cjs tools/tests/stage3-engine.test.cjs | tee tools/tests/results/stage4-1-${{ matrix.browser }}-engine.tap
      - name: Install pinned browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise Lessons 1-8 and integrated state protection
        env:
          HSK_BROWSER: ${{ matrix.browser }}
        run: node tools/tests/integration-step1-browser.cjs
      - name: Preserve exact candidate and evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk1-integration-step1-${{ matrix.browser }}
          path: |
            tools/tests/results/stage4-1-${{ matrix.browser }}-*
            new-hsk1/hsk1/
            new-hsk1/assets/
            tools/tests/integration-step1*.cjs
            tools/tests/stage2-engine.test.cjs
            tools/tests/stage3-engine.test.cjs
            tools/serve-integration-step1.cjs
          retention-days: 14
          if-no-files-found: error
