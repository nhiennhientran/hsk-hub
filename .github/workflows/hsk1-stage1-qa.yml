name: HSK1 Step 1 pilot QA
on:
  push:
    branches: ['work/hsk1-stage1-*']
    paths:
      - 'new-hsk1/hsk1/stage1/**'
      - 'tools/tests/stage1-*'
      - 'tools/serve-stage1.cjs'
      - 'tools/build-stage1.cjs'
      - '.github/workflows/hsk1-stage1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    if: startsWith(github.ref, 'refs/heads/work/hsk1-stage1-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check state transitions and legacy migration
        run: node --test tools/tests/stage1-engine.test.cjs
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium for software regression tests
        run: npx playwright install --with-deps chromium
      - name: Install Chinese glyphs for evidence screenshots
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Build the offline pilot
        run: node tools/build-stage1.cjs
      - name: Exercise the pilot through its user interface
        run: node tools/tests/stage1-browser.cjs
      - name: Save pilot test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk1-step1-evidence
          path: |
            tools/tests/results/stage1-*
            dist/stage1/HSK1-Step1-Lesson3.html
          if-no-files-found: warn
