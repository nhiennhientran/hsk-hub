name: HSK1 modular live verification
on:
  push:
    branches: ['verify/hsk1-modular-live-20261002']
    paths: ['hsk1-app/docs/release-manifest.json', '.github/workflows/hsk1-modular-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hsk1-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: hsk1-app/package-lock.json
      - run: npm ci
      - name: Use official Ubuntu archive for fixed browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          source_dir = Path('/etc/apt/sources.list.d')
          for path in [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'), *source_dir.glob('*.list'), *source_dir.glob('*.sources')]:
              if path.exists():
                  text = path.read_text()
                  path.write_text(text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu'))
          PY
      - name: Install fixed browser
        timeout-minutes: 8
        run: |
          npx playwright install-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install ${{ matrix.browser }}
      - run: npm run test:release -- --project=${{ matrix.browser }}
        env:
          HSK_LIVE_URL: https://nhiennhientran.github.io/hsk-hub/new-hsk1/hsk1/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step9-live-${{ matrix.browser }}-evidence
          path: |
            hsk1-app/.repro-output/
            hsk1-app/test-results/
            hsk1-app/test-results-release/
          include-hidden-files: true
