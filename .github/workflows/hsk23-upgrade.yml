name: HSK2 and HSK3 shared-course acceptance
on:
  push:
    branches: ['feature/hsk23-course-upgrade']
    paths: ['course-app/**', 'hsk1-app/src/services/storage/index.ts', 'hsk1-app/src/services/audio/index.ts', 'hsk1-app/tests/audio.test.mjs', '.github/workflows/hsk23-upgrade.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install exact shared-course dependencies
        run: npm ci --prefix course-app
      - name: Shared engine tests and content/identity validation
        working-directory: course-app
        run: |
          npm test
          npm run check
          HSK_PILOT=1 npm run build
          node tools/package-release.mjs --pilot
      - uses: actions/upload-artifact@v4
        with:
          name: hsk23-frozen-package
          path: course-app/release-package/
          include-hidden-files: true
      - name: Verify small exact-byte transfer without rebuilding
        working-directory: course-app
        run: |
          python3 - <<'PYCODE'
          import shutil
          shutil.copytree('release-package','frozen-code',ignore=shutil.ignore_patterns('*.mp3'))
          PYCODE
          node tools/restore-frozen.mjs frozen-code public restored-check "$GITHUB_SHA"
          diff -rq release-package restored-check
      - uses: actions/upload-artifact@v4
        with:
          name: hsk23-frozen-code
          path: course-app/frozen-code/
          include-hidden-files: true
      - name: Preserve HSK1 default storage contract
        run: npm ci --prefix hsk1-app && npm test --prefix hsk1-app && npm run build:release --prefix hsk1-app
      - uses: actions/upload-artifact@v4
        with:
          name: hsk23-frozen-pilot
          path: course-app/dist/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: hsk23-hsk1-media-regression
          path: hsk1-app/dist/
          include-hidden-files: true
  browser:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: course-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci && npm ci --prefix ../hsk1-app
      - uses: actions/download-artifact@v4
        with:
          name: hsk23-frozen-pilot
          path: course-app/dist/
      - uses: actions/download-artifact@v4
        with:
          name: hsk23-hsk1-media-regression
          path: hsk1-app/dist/
      - uses: actions/download-artifact@v4
        with:
          name: hsk23-frozen-package
          path: course-app/release-package/
      - name: Use official Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          d=Path('/etc/apt/sources.list.d')
          for p in [Path('/etc/apt/sources.list'),Path('/etc/apt/apt-mirrors.txt'),*d.glob('*.list'),*d.glob('*.sources')]:
              if p.exists():
                  s=p.read_text()
                  p.write_text(s.replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu'))
          PY
      - name: Install browser and Chinese fonts
        run: npx playwright install --with-deps ${{ matrix.browser }} && sudo apt-get install -y fonts-noto-cjk
      - name: Test the same frozen bytes without rebuilding
        run: npm run test:browser -- --project=${{ matrix.browser }}
      - name: Test nested production-shaped course entries and shared frozen asset hashes
        run: npm run test:browser -- --config=playwright.package.config.ts --project=${{ matrix.browser }}
      - name: Verify HSK1 native word, line, sequence, seek and interruption audio
        working-directory: hsk1-app
        run: npm run test:smoke -- tests/browser/media.spec.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsk23-pilot-${{ matrix.browser }}-evidence
          path: |
            course-app/.repro-output/
            course-app/test-results/
            course-app/test-results-package/
            hsk1-app/.repro-output/
            hsk1-app/test-results/
          include-hidden-files: true
