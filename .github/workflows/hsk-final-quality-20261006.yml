name: HSK final quality browser verification
on:
  push:
    branches: ['work/hsk-complete-quality-20261006']
    paths:
      - '.github/workflows/hsk-final-quality-20261006.yml'
      - 'course-app/docs/final-quality-20261006/ci-request.json'
permissions:
  contents: read
concurrency:
  group: hsk-final-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked application dependencies
        run: npm ci --prefix course-app && npm ci --prefix hsk1-app
      - name: Verify units and active source adoption
        run: |
          npm test --prefix course-app
          node --experimental-strip-types --test course-app/tests/final-quality/access-and-abcd.test.mjs
          npm test --prefix hsk1-app
          node --experimental-strip-types course-app/tools/verify-official-vi-adoption.mjs --require-complete-course-adoption
          npm run check:browser-fixtures --prefix course-app
      - name: Build recorded applications
        run: npm run build --prefix course-app && npm run build:release --prefix hsk1-app
      - name: Install native browser and Chinese fonts
        working-directory: course-app
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Rerun corrected HSK1 independent work and nonempty unified backup
        working-directory: course-app
        env:
          HSK_FINAL_QA_REPORT: .repro-output/final-quality/${{ matrix.browser }}-browser.json
        run: node node_modules/@playwright/test/cli.js test --config=tests/final-quality/playwright.config.ts --project=${{ matrix.browser }} --grep "HSK1 independent student|all three nonempty student"
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-final-quality-${{ matrix.browser }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            course-app/.repro-output/final-quality/
            course-app/docs/final-quality-20261006/qa/browser-output/
            hsk1-app/.repro-output/student-build-source-audit.json
