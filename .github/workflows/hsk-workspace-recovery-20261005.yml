name: Recover frozen HSK workspace source
on:
  push:
    branches: [work/hsk-workspace-recovery-20261005]
    paths: [.github/workflows/hsk-workspace-recovery-20261005.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact persisted source without credentials
        uses: actions/checkout@v4
        with:
          ref: 9e89fa7145c285ec92990bbbeb5dce3080c5ddf0
          fetch-depth: 1
          persist-credentials: false
      - name: Archive source and Git metadata into downloadable parts
        shell: bash
        env:
          FROZEN_SOURCE_SHA: 9e89fa7145c285ec92990bbbeb5dce3080c5ddf0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE_SHA"
          test -d .git
          mkdir -p recovery-out
          tar --exclude=./recovery-out -czf "$RUNNER_TEMP/repo-source.tar.gz" .
          split -b 29M -d -a 2 "$RUNNER_TEMP/repo-source.tar.gz" recovery-out/repo-source.tar.gz.part
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          archive = Path(os.environ['RUNNER_TEMP']) / 'repo-source.tar.gz'
          parts = sorted(Path('recovery-out').glob('repo-source.tar.gz.part*'))
          assert parts and len(parts) <= 40, f'Unsupported part count: {len(parts)}'
          assert all(p.stat().st_size <= 29 * 1024 * 1024 for p in parts)
          metadata = {
              'schemaVersion': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceSHA': os.environ['FROZEN_SOURCE_SHA'],
              'workflowSHA': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'archive': {'file': archive.name, 'bytes': archive.stat().st_size, 'sha256': digest(archive)},
              'containsGitMetadata': True,
              'checkoutDepth': 1,
              'parts': [{'file': p.name, 'bytes': p.stat().st_size, 'sha256': digest(p),
                         'artifactName': 'hsk-source-recovery-' + p.name.rsplit('part', 1)[1]} for p in parts],
              'operation': 'read-only-recovery-no-build-no-deploy'
          }
          Path('recovery-out/recovery-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps({'archiveBytes': archive.stat().st_size, 'parts': len(parts), 'archiveSHA256': metadata['archive']['sha256']}))
          PY
      - name: Retain recovery metadata
        uses: actions/upload-artifact@v4
        with:
          name: hsk-source-recovery-metadata
          path: recovery-out/recovery-metadata.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Retain source part 00
        if: hashFiles('recovery-out/repo-source.tar.gz.part00') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hsk-source-recovery-00
          path: recovery-out/repo-source.tar.gz.part00
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Retain source part 01
