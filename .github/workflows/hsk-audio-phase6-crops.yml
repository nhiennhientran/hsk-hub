name: HSK2 phase 6 paused by user
on:
  push:
    branches: ['work/hsk-audio-phase6-20261005']
    paths: ['.github/workflows/hsk-audio-phase6-crops.yml']
permissions:
  contents: read
concurrency:
  group: hsk-audio-phase6-crops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record user-requested pause; no inference, build, or deployment
        run: echo 'Paused at user request. No further audio processing is authorized.'
