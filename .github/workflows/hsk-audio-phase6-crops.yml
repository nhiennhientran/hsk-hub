name: HSK2 bounded phase 6 actual crop evidence
on:
  push:
    branches: ['work/hsk-audio-phase6-20261005']
    paths:
      - '.github/workflows/hsk-audio-phase6-crops.yml'
      - 'course-app/docs/continue-phase6-20261005/audio/transcribe-review-batch.py'
      - 'course-app/docs/continue-phase6-20261005/audio/review-batch-input.json'
permissions:
  contents: read
concurrency:
  group: hsk-audio-phase6-crops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crops:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [small, medium]
    env:
      EVIDENCE_HOME: course-app/docs/resume-20261004/media-closure/asr-evidence
      BATCH_HOME: course-app/docs/continue-phase6-20261005/audio
      EVIDENCE_OUTPUT: .repro-output/asr-phase6-crops/${{ matrix.model }}
      HSK_PHASE6_INPUT_SHA: 07563335ffab87f347a7543823f77d6b0988201e2792cdb1248cc6536a3713fe
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
      - name: Prepare exact original PCM decoder
        run: |
          mkdir -p "$EVIDENCE_OUTPUT"
          git rev-parse HEAD > "$EVIDENCE_OUTPUT/checkout-sha.txt"
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Preserve fixed dependency provenance
        run: |
          python -m pip install pip==25.2
          python -m pip install --only-binary=:all: --report "$EVIDENCE_OUTPUT/pip-install-report.json" -r "$EVIDENCE_HOME/requirements.txt"
          python -m pip check
          python -m pip freeze --all > "$EVIDENCE_OUTPUT/pip-freeze.txt"
      - name: Reuse fixed model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .repro-output/asr-model-cache/models--Systran--faster-whisper-${{ matrix.model }}
          key: hsk-crop-public-model-${{ matrix.model }}-fixed-small536b066-medium08e178d-${{ runner.os }}
      - name: Transcribe only actual new crops without source prompts
        run: python "$BATCH_HOME/transcribe-review-batch.py" --model "${{ matrix.model }}" --input "$BATCH_HOME/review-batch-input.json" --input-sha256 "$HSK_PHASE6_INPUT_SHA" --output "$EVIDENCE_OUTPUT"
      - name: Retain exact evidence; no deployment or automatic promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hsk-phase6-crops-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .repro-output/asr-phase6-crops/${{ matrix.model }}/
          retention-days: 30
          if-no-files-found: error
