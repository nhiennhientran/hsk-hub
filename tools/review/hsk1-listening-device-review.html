<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK1 听感与设备验收</title><style>body{font:16px/1.65 system-ui,sans-serif;max-width:980px;margin:auto;padding:24px;color:#23382e;background:#f7f9f6}h1{font-size:28px}h2{font-size:20px}section,article{background:white;border:1px solid #d6dfd8;border-radius:12px;padding:18px;margin:16px 0}button,input,select,textarea{font:inherit;max-width:100%;box-sizing:border-box}button{padding:8px 12px;cursor:pointer;margin:4px;border:1px solid #a4b8ab;border-radius:6px;background:#edf4ee}button:disabled{opacity:.5;cursor:default}input,select,textarea{padding:8px;border:1px solid #b8c7bc;border-radius:5px}textarea{width:100%}.small{font-size:14px;color:#51665a}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.review-item{display:flex;gap:12px;align-items:center;justify-content:space-between}.review-item button{text-align:left;flex:1}.review-item span{white-space:nowrap}.current{outline:2px solid #37674e}#audio-controls{position:sticky;top:0;z-index:2;box-shadow:0 3px 12px #0001}#audio-controls[hidden]{display:none}#audio-progress{width:60%}label{display:block;margin:8px 0}code{overflow-wrap:anywhere}a{color:#245a40} @media(max-width:400px){body{padding:12px}.review-item{display:block}.review-item button{width:100%}}</style>
<header><p class="small">第一步候选版 · 教师验收用 · 不记录学生成绩</p><h1>教材听力与手机操作核验</h1><p>这里列出全部75道听力，供你逐题核对声音、中文原文、越南语选项和答案。默认全部为“未核验”。程序播放通过不等于你已经确认听感；只有亲自检查后才标记。</p><a href="../../new-hsk1/hsk1/index.html">打开候选网站</a></header>
<section><h2>设备记录</h2><label>设备、系统、浏览器和版本 <input id="device" placeholder="例如 iPhone / iOS / Safari 版本"></label><label>实际中文输入法 <input id="ime" placeholder="填写本次实际使用的输入法"></label><div id="device-checks"></div><label>设备操作备注<textarea id="device-notes" rows="3"></textarea></label></section>
<section id="audio-controls" hidden aria-label="试听控制"><div class="row"><strong id="audio-label"></strong><label>速度<select id="audio-rate"><option value="0.65">0.65×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label></div><p id="audio-status" role="status"></p><button id="play-audio">播放</button><button id="pause-audio">暂停</button><button id="replay-audio">从头重听</button><div><progress id="audio-progress" max="1" value="0"></progress> <span id="audio-time"></span></div><audio id="lesson-audio" preload="none"></audio></section>
<section><div class="row"><h2>75道听力</h2><label>课次<select id="lesson-filter"><option value="all">全部15课</option></select></label><strong id="review-count">0/75 已核验</strong></div><p class="small">选择题目，再点击上方播放。请核对切分是否截字、串入下一句，原文与声音是否一致，以及越南语选项是否自然且唯一。</p><div id="question-list"></div></section>
<article id="detail" hidden><h2 id="question-title"></h2><p id="transcript"></p><ol id="options" type="A"></ol><p id="answer"></p><p id="source" class="small"></p><label>本题判断<select id="verdict"><option value="pending">未核验</option><option value="accepted">亲自核验通过</option><option value="issue">发现问题</option></select></label><label>本题备注<textarea id="notes" rows="3"></textarea></label><p id="save-status" class="small"></p></article>
<section><button id="export-review">下载核验记录 JSON</button><p class="small">记录只保存在当前浏览器。下载后发送给老师或项目负责人；本页不会自动上传。未核验项和发现问题项会如实保留。</p></section>
<script src="../../new-hsk1/hsk1/stage3/catalog.js"></script><script src="../../new-hsk1/hsk1/stage3/media-index.js"></script><script src="../../new-hsk1/hsk1/stage3/player.js"></script>
<script>
(()=>{'use strict';const C=window.HSKStep3Catalog,K='hsk1_human_review_i1',get=id=>document.getElementById(id);let active=null,data={schema:1,device:'',ime:'',deviceNotes:'',checks:{},items:{}};try{const old=JSON.parse(localStorage.getItem(K));if(old&&old.schema===1&&old.items&&old.checks)data=old;}catch{}const player=HSKStep3Player.create();const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deviceChecks=['口令输入一次后，刷新和切换模块不重复遮挡','第8课翻译：中文选字、退格、换行、粘贴和长文本','手机键盘弹起后仍能完成输入和提交','点击词块、撤销和重排没有误触或遮挡','翻译截图完整显示5道题、姓名、时间和全部答案','听力正常播放、慢速、倍速、暂停、重播，声音没有明显异常','退出听力或换题时旧声音停止','混课后返回原课，草稿和课次仍正确','导出备份后，在另一浏览器导入并恢复'];
get('device-checks').innerHTML=deviceChecks.map((s,i)=>`<label><input type="checkbox" data-device="${i}" ${data.checks[i]?'checked':''}> ${escape(s)}</label>`).join('');get('device').value=data.device;get('ime').value=data.ime;get('device-notes').value=data.deviceNotes;
for(let n=1;n<=15;n++)get('lesson-filter').add(new Option('第'+n+'课',String(n)));
function save(){data.updatedAt=new Date().toISOString();try{localStorage.setItem(K,JSON.stringify(data));get('save-status').textContent='已保存到本浏览器。';}catch{get('save-status').textContent='浏览器未能保存，请立即下载核验记录。';}get('review-count').textContent=Object.values(data.items).filter(x=>x.verdict==='accepted').length+'/75 已核验';}
function list(){const l=get('lesson-filter').value;get('question-list').innerHTML=C.listening.filter(q=>l==='all'||q.lesson===Number(l)).map(q=>`<div class="review-item"><button data-question="${q.id}" class="${active===q.id?'current':''}">第${q.lesson}课 · ${escape(q.id)}</button><span>${({accepted:'已核验',issue:'发现问题',pending:'未核验'})[data.items[q.id]?.verdict||'pending']}</span></div>`).join('');get('review-count').textContent=Object.values(data.items).filter(x=>x.verdict==='accepted').length+'/75 已核验';}
get('lesson-filter').onchange=list;get('question-list').onclick=e=>{const b=e.target.closest('[data-question]');if(!b)return;active=b.dataset.question;const q=C.listening.find(q=>q.id===active);get('detail').hidden=false;get('question-title').textContent='第'+q.lesson+'课 · '+q.id;get('transcript').textContent=q.transcript.map(t=>t.zh+' / '+t.py+' / '+t.vi).join('\n');get('options').innerHTML=q.options.map(s=>'<li>'+escape(s)+'</li>').join('');get('answer').textContent='答案：'+'ABCD'[q.answer]+' · '+q.explanationVi;get('source').textContent='原轨 '+q.audio.track+' · '+q.audio.start+'—'+q.audio.end+'秒；PDF页 '+q.source.pdfPages.join(', ')+'；裁片 SHA256 '+HSKStep3MediaIndex.clips[q.id].sha256;get('verdict').value=data.items[active]?.verdict||'pending';get('notes').value=data.items[active]?.notes||'';player.setItem({id:active,label:'第'+q.lesson+'课 · '+q.id});list();};
for(const id of ['verdict','notes'])get(id).oninput=()=>{if(active){data.items[active]={verdict:get('verdict').value,notes:get('notes').value,at:new Date().toISOString()};save();list();}};
for(const [id,key] of [['device','device'],['ime','ime'],['device-notes','deviceNotes']])get(id).oninput=()=>{data[key]=get(id).value;save();};get('device-checks').onchange=e=>{if(e.target.dataset.device!==undefined){data.checks[e.target.dataset.device]=e.target.checked;save();}};
get('export-review').onclick=()=>{const payload={...data,scope:'human listening and actual-device review',totalListening:75,unchecked:C.listening.filter(q=>!data.items[q.id]||data.items[q.id].verdict==='pending').map(q=>q.id),items:data.items};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='HSK1-human-device-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};window.addEventListener('pagehide',()=>player.stop());list();})();
</script></html>
